version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dropshipping_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dropshipping_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dropshipping_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dropshipping_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/dropshipping_db?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@postgres:5432/dropshipping_db?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      WATCHPACK_POLLING: "true"
      NODE_ENV: "development"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && npx prisma db seed && npx next dev --turbopack -H 0.0.0.0 -p 3000"

volumes:
  postgres_data:
